services:

  nexus-api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html

    depends_on:
      mariadb:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - nexus_network


  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - nexus-api

    networks:
      - nexus_network


  mariadb:
    image: mariadb:lts

    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - nexus_network


  redis:
    image: redis:8-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping

      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - nexus_network


volumes:

  mariadb_data:

  redis_data:


networks:

  nexus_network:
    driver: bridge
